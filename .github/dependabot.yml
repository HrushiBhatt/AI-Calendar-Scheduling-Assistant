# Keeps every dependency patched: npm packages and the CI actions (pinned by commit). Minor and
# patch updates are grouped so a week's worth arrives as one pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
