name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a commit, not a tag: a tag can be moved to malicious code, and
# that has happened to popular actions. Dependabot proposes updates.
jobs:
  # Scans all history, so a secret that was committed and later removed still fails.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: false
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --config .gitleaks.toml .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # What ships to browsers. Build tools are covered by Dependabot, not this gate.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx ng test --watch=false

  # The live site at https://hrushibhatt.github.io/<repo>/. It builds the app, tests that build
  # the way Pages serves it, and every push to main publishes it to the gh-pages branch, which
  # Pages serves. The path comes from the repo's name, so renaming the repo can't leave the site
  # blank: the next push fixes it.
  pages:
    needs: [secrets, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishing pushes the gh-pages branch
    concurrency:
      group: pages
      cancel-in-progress: true
    env:
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build the site
        run: make build BASE="$PAGES_BASE"
      - name: Test it as Pages serves it
        run: npm run e2e
        working-directory: frontend
      - name: Keep the traces of a failed test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend/dist/brew-focus/browser
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
