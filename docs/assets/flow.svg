<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Animated flow: a request passes through the optional assistant to the deterministic planner, then your review, then the dispatcher starts the block. A planning form reaches the same planner with no model involved.">
<title>Animated flow: a request passes through the optional assistant to the deterministic planner, then your review, then the dispatcher starts the block. A planning form reaches the same planner with no model involved.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#14100d"/><stop offset="1" stop-color="#231913"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" fill-opacity=".05"/></pattern>
<clipPath id="panel"><rect width="1000" height="270" rx="14"/></clipPath>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:#c4b8ae;font-size:13px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.h{fill:#efebe9;font-weight:600}
.mu{fill:#8d8077}
.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:.12em;font-size:11px;fill:#d4a574}

.p1{animation:p1 11s linear infinite}
@keyframes p1{0%{transform:translateX(0);opacity:0}3%{opacity:1}18%{transform:translateX(190px)}26%{transform:translateX(190px)}42%{transform:translateX(380px)}52%{transform:translateX(380px)}66%{transform:translateX(570px)}76%{transform:translateX(570px)}90%{transform:translateX(760px);opacity:1}94%,100%{transform:translateX(760px);opacity:0}}
.lit{opacity:0;animation-duration:11s;animation-iteration-count:infinite}
.l0{animation-name:l0}.l1{animation-name:l1}.l2{animation-name:l2}.l3{animation-name:l3}.l4{animation-name:l4}
@keyframes l0{0%,6%{opacity:1}14%,100%{opacity:0}}
@keyframes l1{0%,15%{opacity:0}19%,27%{opacity:1}32%,100%{opacity:0}}
@keyframes l2{0%,38%{opacity:0}43%,53%{opacity:1}58%,100%{opacity:0}}
@keyframes l3{0%,62%{opacity:0}67%,77%{opacity:1}82%,100%{opacity:0}}
@keyframes l4{0%,86%{opacity:0}91%,99%{opacity:1}100%{opacity:0}}
.p2{animation:p2 11s linear infinite}
@keyframes p2{0%,8%{opacity:0;transform:none}12%{opacity:1;transform:none}30%{transform:translateX(170px)}42%{opacity:1;transform:translate(170px,-52px)}46%,100%{opacity:0;transform:translate(170px,-52px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#panel)">
<rect width="1000" height="270" fill="url(#bg)"/><rect width="1000" height="270" fill="url(#dots)"/>
<text x="24" y="38" class="k" style="font-size:12px" >FROM A SENTENCE TO A RUNNING TIMER</text><rect x="388" y="46" width="204" height="20" rx="3" fill="#d4a574" fill-opacity=".14"/><text x="490" y="60" class="m" text-anchor="middle" fill="#e8c49a" style="fill:#e8c49a;font-size:11px">the model never picks a time</text><rect x="24" y="74" width="172" height="112" rx="6" fill="#1c1714" stroke="#332a24" stroke-width="1"/><rect class="lit l0" x="24" y="74" width="172" height="112" rx="6" fill="#d4a574" fill-opacity=".14" stroke="#e8c49a" stroke-width="2"/><text x="38" y="100" class="k" >YOU</text><text x="38" y="124" style="font-size:12.5px" >“Three blocks on</text><text x="38" y="142" style="font-size:12.5px" >the compiler project</text><text x="38" y="160" style="font-size:12.5px" >tomorrow”</text><path d="M198 130.0h13" stroke="#8d8077" stroke-width="2"/><path d="M211 125.0l6 5-6 5z" fill="#8d8077"/><rect x="214" y="74" width="172" height="112" rx="6" fill="#1c1714" stroke="#332a24" stroke-width="1"/><rect class="lit l1" x="214" y="74" width="172" height="112" rx="6" fill="#d4a574" fill-opacity=".14" stroke="#e8c49a" stroke-width="2"/><text x="228" y="100" class="k" >ASSISTANT</text><text x="228" y="124" style="font-size:12.5px" >Turns words into one</text><text x="228" y="142" style="font-size:12.5px" >validated tool call.</text><text x="228" y="160" style="font-size:12.5px" >Optional.</text><path d="M388 130.0h13" stroke="#8d8077" stroke-width="2"/><path d="M401 125.0l6 5-6 5z" fill="#8d8077"/><rect x="404" y="74" width="172" height="112" rx="6" fill="#1c1714" stroke="#d4a574" stroke-width="2"/><rect class="lit l2" x="404" y="74" width="172" height="112" rx="6" fill="#d4a574" fill-opacity=".14" stroke="#e8c49a" stroke-width="2"/><text x="418" y="100" class="k" >PLANNER</text><text x="418" y="124" style="font-size:12.5px" >Pure function. Picks</text><text x="418" y="142" style="font-size:12.5px" >every time. No network,</text><text x="418" y="160" style="font-size:12.5px" >clock or model.</text><path d="M578 130.0h13" stroke="#8d8077" stroke-width="2"/><path d="M591 125.0l6 5-6 5z" fill="#8d8077"/><rect x="594" y="74" width="172" height="112" rx="6" fill="#1c1714" stroke="#332a24" stroke-width="1"/><rect class="lit l3" x="594" y="74" width="172" height="112" rx="6" fill="#d4a574" fill-opacity=".14" stroke="#e8c49a" stroke-width="2"/><text x="608" y="100" class="k" >YOUR REVIEW</text><text x="608" y="124" style="font-size:12.5px" >Every block has its</text><text x="608" y="142" style="font-size:12.5px" >reason. Accept all,</text><text x="608" y="160" style="font-size:12.5px" >some, or none.</text><path d="M768 130.0h13" stroke="#8d8077" stroke-width="2"/><path d="M781 125.0l6 5-6 5z" fill="#8d8077"/><rect x="784" y="74" width="172" height="112" rx="6" fill="#1c1714" stroke="#332a24" stroke-width="1"/><rect class="lit l4" x="784" y="74" width="172" height="112" rx="6" fill="#d4a574" fill-opacity=".14" stroke="#e8c49a" stroke-width="2"/><text x="798" y="100" class="k" >DISPATCHER</text><text x="798" y="124" style="font-size:12.5px" >60-second warning,</text><text x="798" y="142" style="font-size:12.5px" >then the block</text><text x="798" y="160" style="font-size:12.5px" >starts itself.</text><circle class="p1" cx="110" cy="174" r="6" fill="#e8c49a"/><rect x="214" y="204" width="172" height="44" rx="6" fill="#1c1714" stroke="#332a24" stroke-dasharray="4 4"/><text x="300" y="223" class="h" style="font-size:12.5px" text-anchor="middle" >Planning form</text><text x="300" y="239" class="mu" style="font-size:11.5px" text-anchor="middle" >or “fill my free time”</text><path d="M386 226h104v-37" fill="none" stroke="#8d8077" stroke-width="2"/><path d="M485 192l5-6 5 6z" fill="#8d8077"/><circle class="p2" cx="310" cy="226" r="6" fill="#8fd19e"/><text x="510" y="223" style="font-size:13px" >No API key, or the model provider is down? Same planner, same rules.</text><text x="510" y="241" class="mu" style="font-size:12.5px" >The feature works without any AI at all.</text>
</g>
</svg>
