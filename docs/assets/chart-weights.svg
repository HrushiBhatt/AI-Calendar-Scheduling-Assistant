<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Bar chart of scheduler weights: track record +3.0, due soon +2.0, energy match +1.5, priority +1.0, contiguity +1.0, after meetings −1.0, fragmentation −1.5">
<title>Bar chart of scheduler weights: track record +3.0, due soon +2.0, energy match +1.5, priority +1.0, contiguity +1.0, after meetings −1.0, fragmentation −1.5</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#14100d"/><stop offset="1" stop-color="#231913"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" fill-opacity=".05"/></pattern>
<clipPath id="panel"><rect width="1000" height="340" rx="14"/></clipPath>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:#c4b8ae;font-size:13px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.h{fill:#efebe9;font-weight:600}
.mu{fill:#8d8077}
.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:.12em;font-size:11px;fill:#d4a574}
.sh{animation:sh 7s ease-in-out infinite}@keyframes sh{0%{transform:translateX(0)}60%,100%{transform:translateX(811px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#panel)">
<rect width="1000" height="340" fill="url(#bg)"/><rect width="1000" height="340" fill="url(#dots)"/>
<text x="24" y="34" class="h" style="font-size:17px" >What the scheduler prefers</text><text x="24" y="56" style="font-size:13px" >Weights from score.go. Each signal is scored 0 to 1, then weighted; the best-scoring slot wins.</text><rect x="680" y="24" width="12" height="12" rx="2" fill="#c67d32"/><text x="698" y="34" style="font-size:12.5px" >pulls a slot up</text><rect x="812" y="24" width="12" height="12" rx="2" fill="#4f9bdc"/><text x="830" y="34" style="font-size:12.5px" >pushes it down</text><rect x="561" y="80" width="1" height="244" fill="#8d8077"/><text x="24" y="103" style="fill:#efebe9;font-size:13.5px">Your track record at that hour</text><path d="M563.0 88h350.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-350.0z" fill="#c67d32"/><text x="925" y="103" class="m" style="fill:#efebe9;font-size:13px">+3.0</text><text x="24" y="137" style="fill:#efebe9;font-size:13.5px">How soon the task is due</text><path d="M563.0 122h232.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-232.0z" fill="#c67d32"/><text x="807" y="137" class="m" style="fill:#efebe9;font-size:13px">+2.0</text><text x="24" y="171" style="fill:#efebe9;font-size:13.5px">Deep work in your strongest hours</text><path d="M563.0 156h173.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-173.0z" fill="#c67d32"/><text x="748" y="171" class="m" style="fill:#efebe9;font-size:13px">+1.5</text><text x="24" y="205" style="fill:#efebe9;font-size:13.5px">The task's priority</text><path d="M563.0 190h114.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-114.0z" fill="#c67d32"/><text x="689" y="205" class="m" style="fill:#efebe9;font-size:13px">+1.0</text><text x="24" y="239" style="fill:#efebe9;font-size:13.5px">Next to a block of the same task</text><path d="M563.0 224h114.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-114.0z" fill="#c67d32"/><text x="689" y="239" class="m" style="fill:#efebe9;font-size:13px">+1.0</text><text x="24" y="273" style="fill:#efebe9;font-size:13.5px">Right after an hour of meetings</text><path d="M559.0 258h-114.0a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h114.0z" fill="#4f9bdc"/><text x="433" y="273" class="m" text-anchor="end" style="fill:#efebe9;font-size:13px">−1.0</text><text x="24" y="307" style="fill:#efebe9;font-size:13.5px">Strands time another block could use</text><path d="M559.0 292h-173.0a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h173.0z" fill="#4f9bdc"/><text x="374" y="307" class="m" text-anchor="end" style="fill:#efebe9;font-size:13px">−1.5</text><defs><linearGradient id="sg"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="bars"><path d="M563.0 88h350.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-350.0z"/><path d="M563.0 122h232.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-232.0z"/><path d="M563.0 156h173.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-173.0z"/><path d="M563.0 190h114.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-114.0z"/><path d="M563.0 224h114.0a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-114.0z"/><path d="M559.0 258h-114.0a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h114.0z"/><path d="M559.0 292h-173.0a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h173.0z"/></clipPath></defs><g clip-path="url(#bars)"><rect class="sh" x="244" y="88" width="140" height="238" fill="url(#sg)"/></g>
</g>
</svg>
