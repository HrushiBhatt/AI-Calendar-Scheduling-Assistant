<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Animated diagram: a timer actor runs on the server and streams updates to a laptop, a phone and a second tab. When the laptop closes the timer keeps running; when it reopens it is instantly back in sync. State is saved to SQLite.">
<title>Animated diagram: a timer actor runs on the server and streams updates to a laptop, a phone and a second tab. When the laptop closes the timer keeps running; when it reopens it is instantly back in sync. State is saved to SQLite.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#14100d"/><stop offset="1" stop-color="#231913"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" fill-opacity=".05"/></pattern>
<clipPath id="panel"><rect width="1000" height="310" rx="14"/></clipPath>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:#c4b8ae;font-size:13px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.h{fill:#efebe9;font-weight:600}
.mu{fill:#8d8077}
.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:.12em;font-size:11px;fill:#d4a574}

.dg{opacity:0;animation:dg 16s steps(1) infinite}
@keyframes dg{0%{opacity:1}6.25%,100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 16s linear infinite}
@keyframes bar{0%{transform:scaleX(1)}100%{transform:scaleX(.82)}}
.pulse{animation-duration:2s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes pa{0%{transform:translate(0,0);opacity:1}85%{opacity:1}100%{transform:translate(236px,-82px);opacity:0}}
@keyframes pb{0%{transform:translate(0,0);opacity:1}85%{opacity:1}100%{transform:translate(236px,0);opacity:0}}
@keyframes pc{0%{transform:translate(0,0);opacity:1}85%{opacity:1}100%{transform:translate(236px,82px);opacity:0}}
.gone{animation:gone 16s steps(1) infinite}
@keyframes gone{0%,30%{opacity:1}30.01%,68%{opacity:.28}68.01%,100%{opacity:1}}
.cut{animation:cut 16s steps(1) infinite}
@keyframes cut{0%,30%{visibility:visible}30.01%,68%{visibility:hidden}68.01%,100%{visibility:visible}}
.n1{animation:n1 16s steps(1) infinite;opacity:0}
@keyframes n1{0%,30%{opacity:0}30.01%,68%{opacity:1}68.01%,100%{opacity:0}}
.n2{animation:n2 16s steps(1) infinite;opacity:0}
@keyframes n2{0%,68%{opacity:0}68.01%,86%{opacity:1}86.01%,100%{opacity:0}}
.disk{animation:disk 4s ease-in-out infinite}
@keyframes disk{0%,70%,100%{fill-opacity:.15}80%{fill-opacity:.8}}
@media (prefers-reduced-motion:reduce){.dg.first{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#panel)">
<rect width="1000" height="310" fill="url(#bg)"/><rect width="1000" height="310" fill="url(#dots)"/>
<text x="24" y="32" class="k" style="font-size:12px" >THE SERVER OWNS THE TIMER</text><rect x="24" y="50" width="396" height="240" rx="8" fill="#1c1714" stroke="#d4a574" stroke-width="2"/><text x="44" y="78" class="h" style="font-size:15px" >Go server</text><text x="404" y="78" class="mu" style="font-size:12px" text-anchor="end" >one goroutine per running timer</text><rect x="44" y="94" width="356" height="92" rx="6" fill="#120e0b" stroke="#332a24"/><text x="60" y="116" class="k" >TIMER ACTOR</text><text class="dg m first" style="animation-delay:0s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:59</text><text class="dg m" style="animation-delay:-15s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:58</text><text class="dg m" style="animation-delay:-14s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:57</text><text class="dg m" style="animation-delay:-13s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:56</text><text class="dg m" style="animation-delay:-12s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:55</text><text class="dg m" style="animation-delay:-11s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:54</text><text class="dg m" style="animation-delay:-10s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:53</text><text class="dg m" style="animation-delay:-9s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:52</text><text class="dg m" style="animation-delay:-8s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:51</text><text class="dg m" style="animation-delay:-7s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:50</text><text class="dg m" style="animation-delay:-6s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:49</text><text class="dg m" style="animation-delay:-5s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:48</text><text class="dg m" style="animation-delay:-4s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:47</text><text class="dg m" style="animation-delay:-3s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:46</text><text class="dg m" style="animation-delay:-2s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:45</text><text class="dg m" style="animation-delay:-1s;font-size:34px;fill:#efebe9;font-weight:700" x="60" y="164">24:44</text><rect x="200" y="146" width="184" height="12" rx="2" fill="#332a24"/><rect class="bar" x="200" y="146" width="184" height="12" rx="2" fill="#d4a574"/><text x="44" y="212" style="font-size:12.5px" >Commands arrive over a channel. Nothing else touches its</text><text x="44" y="230" style="font-size:12.5px" >state, so it needs no locks and can't race.</text><rect class="disk" x="44" y="248" width="16" height="24" rx="3" fill="#8fd19e" stroke="#8fd19e"/><text x="70" y="258" style="font-size:12.5px" >SQLite: saved at the start and on every change</text><text x="70" y="275" class="mu" style="font-size:12px" >A restart restores every running and paused timer.</text><g class="gone"><rect x="668" y="72" width="308" height="62" rx="6" fill="#1c1714" stroke="#332a24"/><text x="684" y="96" class="h" style="font-size:13px" >Laptop</text><text class="dg m first" style="animation-delay:0s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:59</text><text class="dg m" style="animation-delay:-15s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:58</text><text class="dg m" style="animation-delay:-14s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:57</text><text class="dg m" style="animation-delay:-13s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:56</text><text class="dg m" style="animation-delay:-12s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:55</text><text class="dg m" style="animation-delay:-11s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:54</text><text class="dg m" style="animation-delay:-10s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:53</text><text class="dg m" style="animation-delay:-9s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:52</text><text class="dg m" style="animation-delay:-8s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:51</text><text class="dg m" style="animation-delay:-7s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:50</text><text class="dg m" style="animation-delay:-6s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:49</text><text class="dg m" style="animation-delay:-5s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:48</text><text class="dg m" style="animation-delay:-4s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:47</text><text class="dg m" style="animation-delay:-3s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:46</text><text class="dg m" style="animation-delay:-2s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:45</text><text class="dg m" style="animation-delay:-1s;font-size:13px;fill:#c4b8ae" x="684" y="117">24:44</text><rect x="740" y="108" width="220" height="8" rx="2" fill="#332a24"/><rect class="bar" x="740" y="108" width="220" height="8" rx="2" fill="#d4a574"/></g><g><rect x="668" y="154" width="308" height="62" rx="6" fill="#1c1714" stroke="#332a24"/><text x="684" y="178" class="h" style="font-size:13px" >Phone</text><text class="dg m first" style="animation-delay:0s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:59</text><text class="dg m" style="animation-delay:-15s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:58</text><text class="dg m" style="animation-delay:-14s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:57</text><text class="dg m" style="animation-delay:-13s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:56</text><text class="dg m" style="animation-delay:-12s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:55</text><text class="dg m" style="animation-delay:-11s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:54</text><text class="dg m" style="animation-delay:-10s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:53</text><text class="dg m" style="animation-delay:-9s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:52</text><text class="dg m" style="animation-delay:-8s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:51</text><text class="dg m" style="animation-delay:-7s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:50</text><text class="dg m" style="animation-delay:-6s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:49</text><text class="dg m" style="animation-delay:-5s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:48</text><text class="dg m" style="animation-delay:-4s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:47</text><text class="dg m" style="animation-delay:-3s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:46</text><text class="dg m" style="animation-delay:-2s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:45</text><text class="dg m" style="animation-delay:-1s;font-size:13px;fill:#c4b8ae" x="684" y="199">24:44</text><rect x="740" y="190" width="220" height="8" rx="2" fill="#332a24"/><rect class="bar" x="740" y="190" width="220" height="8" rx="2" fill="#d4a574"/></g><g><rect x="668" y="236" width="308" height="62" rx="6" fill="#1c1714" stroke="#332a24"/><text x="684" y="260" class="h" style="font-size:13px" >Second tab</text><text class="dg m first" style="animation-delay:0s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:59</text><text class="dg m" style="animation-delay:-15s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:58</text><text class="dg m" style="animation-delay:-14s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:57</text><text class="dg m" style="animation-delay:-13s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:56</text><text class="dg m" style="animation-delay:-12s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:55</text><text class="dg m" style="animation-delay:-11s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:54</text><text class="dg m" style="animation-delay:-10s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:53</text><text class="dg m" style="animation-delay:-9s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:52</text><text class="dg m" style="animation-delay:-8s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:51</text><text class="dg m" style="animation-delay:-7s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:50</text><text class="dg m" style="animation-delay:-6s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:49</text><text class="dg m" style="animation-delay:-5s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:48</text><text class="dg m" style="animation-delay:-4s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:47</text><text class="dg m" style="animation-delay:-3s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:46</text><text class="dg m" style="animation-delay:-2s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:45</text><text class="dg m" style="animation-delay:-1s;font-size:13px;fill:#c4b8ae" x="684" y="281">24:44</text><rect x="740" y="272" width="220" height="8" rx="2" fill="#332a24"/><rect class="bar" x="740" y="272" width="220" height="8" rx="2" fill="#d4a574"/></g><text x="960" y="96" class="n1" text-anchor="end" style="fill:#e8c49a;font-size:12px">closed: timer keeps running</text><text x="960" y="96" class="n2" text-anchor="end" style="fill:#8fd19e;font-size:12px">reopened: instantly in sync</text><path d="M424 184L664 102" stroke="#332a24" stroke-width="2"/><path d="M424 184L664 184" stroke="#332a24" stroke-width="2"/><path d="M424 184L664 266" stroke="#332a24" stroke-width="2"/><text x="544" y="142" class="mu" style="font-size:12px" text-anchor="middle" transform="rotate(-18 544 142)">Server-Sent Events</text><g class="cut"><circle class="pulse" style="animation-name:pa;animation-delay:0s" cx="428" cy="184" r="5" fill="#e8c49a"/></g><circle class="pulse" style="animation-name:pb;animation-delay:0.6s" cx="428" cy="184" r="5" fill="#e8c49a"/><circle class="pulse" style="animation-name:pc;animation-delay:1.2s" cx="428" cy="184" r="5" fill="#e8c49a"/>
</g>
</svg>
