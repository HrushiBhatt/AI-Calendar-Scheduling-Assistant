<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="A counter falls behind when a tab is throttled or closed. A saved deadline stays right, because time left is worked out from the end time.">
<title>A counter falls behind when a tab is throttled or closed. A saved deadline stays right, because time left is worked out from the end time.</title>
<style>
.flow { stroke-dasharray: 8 8; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -16; } }

.draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 9s linear infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.now { animation: now 9s linear infinite; }
@keyframes now { from { transform: translateX(0); } to { transform: translateX(760px); } }
.gap { animation: gap 9s linear infinite; }
@keyframes gap { 0%, 94% { opacity: 0; } 97%, 100% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
