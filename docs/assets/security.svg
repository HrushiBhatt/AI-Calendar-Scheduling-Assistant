</style>
<g clip-path="url(#panel)">
<rect width="1000" height="296" fill="url(#bg)"/><rect width="1000" height="296" fill="url(#dots)"/>
<text x="24" y="32" class="k" style="font-size:12px" >EVERY REQUEST PASSES EVERY LAYER</text><path d="M116 170H882" stroke="#332a24" stroke-width="3"/><rect x="24" y="136" width="92" height="68" rx="6" fill="#1c1714" stroke="#332a24"/><text x="70" y="166" class="h" style="font-size:13px" text-anchor="middle" >The</text><text x="70" y="184" class="h" style="font-size:13px" text-anchor="middle" >internet</text><rect x="866" y="116" width="110" height="108" rx="6" fill="#1c1714" stroke="#d4a574" stroke-width="2"/><text x="921" y="142" class="h" style="font-size:13px" text-anchor="middle" >Your data</text><text x="921" y="162" class="mu" style="font-size:11px" text-anchor="middle" >bcrypt hashes</text><text x="921" y="177" class="mu" style="font-size:11px" text-anchor="middle" >AES-256-GCM</text><text x="921" y="192" class="mu" style="font-size:11px" text-anchor="middle" >tokens, private</text><text x="921" y="207" class="mu" style="font-size:11px" text-anchor="middle" >database file</text><rect x="179" y="106" width="14" height="128" rx="3" fill="#57504a"/><rect id="g0" class="gf0" x="179" y="106" width="14" height="128" rx="3" fill="#ef5350" opacity="0"/><text x="186" y="254" style="font-size:12px" text-anchor="middle" >Browser</text><text x="186" y="270" style="font-size:12px" text-anchor="middle" >headers</text><rect x="273" y="106" width="14" height="128" rx="3" fill="#57504a"/><rect id="g1" class="gf1" x="273" y="106" width="14" height="128" rx="3" fill="#ef5350" opacity="0"/><text x="280" y="254" style="font-size:12px" text-anchor="middle" >Size and</text><text x="280" y="270" style="font-size:12px" text-anchor="middle" >time limits</text><rect x="367" y="106" width="14" height="128" rx="3" fill="#57504a"/><rect id="g2" class="gf2" x="367" y="106" width="14" height="128" rx="3" fill="#ef5350" opacity="0"/><text x="374" y="254" style="font-size:12px" text-anchor="middle" >Cross-site</text><text x="374" y="270" style="font-size:12px" text-anchor="middle" >check</text><rect x="461" y="106" width="14" height="128" rx="3" fill="#57504a"/><rect id="g3" class="gf3" x="461" y="106" width="14" height="128" rx="3" fill="#ef5350" opacity="0"/><text x="468" y="254" style="font-size:12px" text-anchor="middle" >Rate</text><text x="468" y="270" style="font-size:12px" text-anchor="middle" >limits</text><rect x="555" y="106" width="14" height="128" rx="3" fill="#57504a"/><rect id="g4" class="gf4" x="555" y="106" width="14" height="128" rx="3" fill="#ef5350" opacity="0"/><text x="562" y="254" style="font-size:12px" text-anchor="middle" >CSRF</text><text x="562" y="270" style="font-size:12px" text-anchor="middle" >token</text><rect x="649" y="106" width="14" height="128" rx="3" fill="#57504a"/><rect id="g5" class="gf5" x="649" y="106" width="14" height="128" rx="3" fill="#ef5350" opacity="0"/><text x="656" y="254" style="font-size:12px" text-anchor="middle" >Live signed</text><text x="656" y="270" style="font-size:12px" text-anchor="middle" >session</text><rect x="743" y="106" width="14" height="128" rx="3" fill="#57504a"/><rect id="g6" class="gf6" x="743" y="106" width="14" height="128" rx="3" fill="#ef5350" opacity="0"/><text x="750" y="254" style="font-size:12px" text-anchor="middle" >Owner</text><text x="750" y="270" style="font-size:12px" text-anchor="middle" >check</text><circle class="a0" cx="116" cy="170" r="8" fill="#ef5350"/><g class="t0"><circle cx="30" cy="69" r="5" fill="#ef5350"/><text x="44" y="74" class="h" style="font-size:15px" >Oversized request</text><text x="976" y="74" class="m" text-anchor="end" style="fill:#ef5350;font-size:14px">413 Too Large</text></g><circle class="a1" cx="116" cy="170" r="8" fill="#ef5350"/><g class="t1"><circle cx="30" cy="69" r="5" fill="#ef5350"/><text x="44" y="74" class="h" style="font-size:15px" >Cross-site POST from another page</text><text x="976" y="74" class="m" text-anchor="end" style="fill:#ef5350;font-size:14px">403 Forbidden</text></g><circle class="a2" cx="116" cy="170" r="8" fill="#ef5350"/><g class="t2"><circle cx="30" cy="69" r="5" fill="#ef5350"/><text x="44" y="74" class="h" style="font-size:15px" >Password guessing</text><text x="976" y="74" class="m" text-anchor="end" style="fill:#ef5350;font-size:14px">429 Too Many Requests</text></g><circle class="a3" cx="116" cy="170" r="8" fill="#ef5350"/><g class="t3"><circle cx="30" cy="69" r="5" fill="#ef5350"/><text x="44" y="74" class="h" style="font-size:15px" >Forged form with no token</text><text x="976" y="74" class="m" text-anchor="end" style="fill:#ef5350;font-size:14px">403 Forbidden</text></g><circle class="a4" cx="116" cy="170" r="8" fill="#ef5350"/><g class="t4"><circle cx="30" cy="69" r="5" fill="#ef5350"/><text x="44" y="74" class="h" style="font-size:15px" >Stolen cookie, after the owner signed out</text><text x="976" y="74" class="m" text-anchor="end" style="fill:#ef5350;font-size:14px">401 Unauthorized</text></g><circle class="a5" cx="116" cy="170" r="8" fill="#ef5350"/><g class="t5"><circle cx="30" cy="69" r="5" fill="#ef5350"/><text x="44" y="74" class="h" style="font-size:15px" >Asking for another user's task</text><text x="976" y="74" class="m" text-anchor="end" style="fill:#ef5350;font-size:14px">404 Not Found</text></g><circle class="ok" cx="116" cy="170" r="8" fill="#8fd19e"/><g class="tok"><circle cx="30" cy="69" r="5" fill="#8fd19e"/><text x="44" y="74" class="h" style="font-size:15px" >You, signed in, reaching your own data</text><text x="976" y="74" class="m" text-anchor="end" style="fill:#8fd19e;font-size:14px">200 OK</text></g>
</g>
