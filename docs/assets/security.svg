<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 296" width="1000" height="296" role="img" aria-label="A strict page policy lets in only this site's own files. On the server, passwords are hashed with bcrypt, the JWT is in an HttpOnly cookie, changes need a CSRF token, sign-ins are rate limited and every query is scoped to its user.">
<title>A strict page policy lets in only this site's own files. On the server, passwords are hashed with bcrypt, the JWT is in an HttpOnly cookie, changes need a CSRF token, sign-ins are rate limited and every query is scoped to its user.</title>
<style>
.flow { stroke-dasharray: 8 8; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -16; } }

.pass { animation: pass 3.2s linear infinite; }
@keyframes pass { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(210px); opacity: 0; } }
.block { animation: block 3.2s linear infinite; }
@keyframes block { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translateX(96px); opacity: 1; } 62%, 100% { transform: translateX(96px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
