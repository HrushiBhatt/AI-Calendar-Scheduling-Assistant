<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="296" viewBox="0 0 1000 296" role="img" aria-label="Animated diagram: requests pass seven layers on the way to your data. Oversized requests, cross-site posts, password guessing, forged forms, stolen cookies and requests for other users' data are each stopped at a different layer, while a legitimate request reaches the data.">
<title>Animated diagram: requests pass seven layers on the way to your data. Oversized requests, cross-site posts, password guessing, forged forms, stolen cookies and requests for other users' data are each stopped at a different layer, while a legitimate request reaches the data.</title>
