<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-label="Animated scheduler steps on a sample day: meetings, then free time after buffers and lunch, then candidate start times on a 15-minute grid, then three chosen blocks, each with the scheduler's own written reason">
<title>Animated scheduler steps on a sample day: meetings, then free time after buffers and lunch, then candidate start times on a 15-minute grid, then three chosen blocks, each with the scheduler's own written reason</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#14100d"/><stop offset="1" stop-color="#231913"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" fill-opacity=".05"/></pattern>
<clipPath id="panel"><rect width="1000" height="356" rx="14"/></clipPath>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:#c4b8ae;font-size:13px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.h{fill:#efebe9;font-weight:600}
.mu{fill:#8d8077}
.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:.12em;font-size:11px;fill:#d4a574}

.r1,.r2,.r3,.r4,.why{animation-duration:15s;animation-iteration-count:infinite;animation-fill-mode:both}
.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}
@keyframes r1{0%,2%{opacity:0}6%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes r2{0%,18%{opacity:0}22%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes r3{0%,34%{opacity:0}38%,94%{opacity:1}97%,100%{opacity:0}}
.tick{animation:tick 1.2s ease-in-out infinite}
@keyframes tick{0%,100%{fill-opacity:.25}50%{fill-opacity:.95}}
.b1{animation-name:b1}.b2{animation-name:b2}.b3{animation-name:b3}
@keyframes b1{0%,50%{opacity:0}54%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes b2{0%,60%{opacity:0}64%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes b3{0%,70%{opacity:0}74%,94%{opacity:1}97%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#panel)">
<rect width="1000" height="356" fill="url(#bg)"/><rect width="1000" height="356" fill="url(#dots)"/>
<text x="24" y="30" class="k" style="font-size:12px" >THE SCHEDULER, STEP BY STEP</text><text x="975" y="30" class="mu" style="font-size:12px" text-anchor="end" >actual planner output for this sample day</text><rect x="150.0" y="52" width="1" height="204" fill="#332a24"/><text x="150" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >9am</text><rect x="253.1" y="52" width="1" height="204" fill="#332a24"/><text x="253" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >10am</text><rect x="356.2" y="52" width="1" height="204" fill="#332a24"/><text x="356" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >11am</text><rect x="459.4" y="52" width="1" height="204" fill="#332a24"/><text x="459" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >12pm</text><rect x="562.5" y="52" width="1" height="204" fill="#332a24"/><text x="562" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >1pm</text><rect x="665.6" y="52" width="1" height="204" fill="#332a24"/><text x="666" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >2pm</text><rect x="768.8" y="52" width="1" height="204" fill="#332a24"/><text x="769" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >3pm</text><rect x="871.9" y="52" width="1" height="204" fill="#332a24"/><text x="872" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >4pm</text><rect x="975.0" y="52" width="1" height="204" fill="#332a24"/><text x="975" y="47" class="m mu" style="font-size:11px" text-anchor="middle" >5pm</text><text x="24" y="85" class="k" >1</text><text x="44" y="85" class="h" style="font-size:13.5px" >Calendar</text><rect x="150" y="64" width="825" height="34" rx="3" fill="#1c1714"/><text x="24" y="137" class="k" >2</text><text x="44" y="137" class="h" style="font-size:13.5px" >Free time</text><rect x="150" y="116" width="825" height="34" rx="3" fill="#1c1714"/><text x="24" y="189" class="k" >3</text><text x="44" y="189" class="h" style="font-size:13.5px" >Candidates</text><rect x="150" y="168" width="825" height="34" rx="3" fill="#1c1714"/><text x="24" y="241" class="k" >4</text><text x="44" y="241" class="h" style="font-size:13.5px" >Plan</text><rect x="150" y="220" width="825" height="34" rx="3" fill="#1c1714"/><g class="r1"><rect x="201.6" y="68" width="77.3" height="26" rx="2" fill="#57504a"/><text x="240" y="85" text-anchor="middle" style="fill:#efebe9;font-size:11px">Standup</text><rect x="614.1" y="68" width="77.3" height="26" rx="2" fill="#57504a"/><text x="653" y="85" text-anchor="middle" style="fill:#efebe9;font-size:11px">Design review</text><rect x="871.9" y="68" width="51.6" height="26" rx="2" fill="#57504a"/><text x="929" y="85" style="fill:#c4b8ae;font-size:11px">1:1</text></g><g class="r2"><rect x="150.0" y="120" width="34.4" height="26" rx="2" fill="#8fd19e" fill-opacity=".22" stroke="#8fd19e" stroke-opacity=".6"/><rect x="296.1" y="120" width="163.3" height="26" rx="2" fill="#8fd19e" fill-opacity=".22" stroke="#8fd19e" stroke-opacity=".6"/><rect x="562.5" y="120" width="34.4" height="26" rx="2" fill="#8fd19e" fill-opacity=".22" stroke="#8fd19e" stroke-opacity=".6"/><rect x="708.6" y="120" width="146.1" height="26" rx="2" fill="#8fd19e" fill-opacity=".22" stroke="#8fd19e" stroke-opacity=".6"/><rect x="940.6" y="120" width="34.4" height="26" rx="2" fill="#8fd19e" fill-opacity=".22" stroke="#8fd19e" stroke-opacity=".6"/><text x="511" y="137" class="mu" style="font-size:11px" text-anchor="middle" >lunch</text></g><g class="r3"><rect class="tick" style="animation-delay:0.00s" x="305.7" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.07s" x="331.5" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.15s" x="357.2" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.22s" x="383.0" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.30s" x="408.8" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.38s" x="718.2" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.45s" x="744.0" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.53s" x="769.8" y="174" width="4" height="22" fill="#d4a574"/><rect class="tick" style="animation-delay:0.60s" x="795.5" y="174" width="4" height="22" fill="#d4a574"/></g><g class="why b1"><rect x="304.7" y="224" width="43.0" height="26" rx="2" fill="#d4a574"/><rect x="347.7" y="224" width="8.6" height="26" rx="2" fill="#8fd19e" fill-opacity=".35"/></g><g class="why b2"><rect x="356.2" y="224" width="43.0" height="26" rx="2" fill="#d4a574"/><rect x="399.2" y="224" width="8.6" height="26" rx="2" fill="#8fd19e" fill-opacity=".35"/></g><g class="why b3"><rect x="407.8" y="224" width="43.0" height="26" rx="2" fill="#d4a574"/><rect x="450.8" y="224" width="8.6" height="26" rx="2" fill="#8fd19e" fill-opacity=".35"/></g><text x="473" y="241" class="mu" style="font-size:11.5px" >each block keeps its 5-minute rest (green)</text><g class="why b1"><rect x="24" y="271" width="12" height="12" rx="2" fill="#d4a574"/><text x="44" y="282" class="m" style="fill:#efebe9;font-size:12.5px">10:30</text><text x="92" y="282" class="h" style="font-size:13px" >Lab report</text><text x="232" y="282" style="font-size:13px" >a short break after your meeting first</text></g><g class="why b2"><rect x="24" y="295" width="12" height="12" rx="2" fill="#d4a574"/><text x="44" y="306" class="m" style="fill:#efebe9;font-size:12.5px">11:00</text><text x="92" y="306" class="h" style="font-size:13px" >Compiler project</text><text x="232" y="306" style="font-size:13px" >the earliest open slot that fits</text></g><g class="why b3"><rect x="24" y="319" width="12" height="12" rx="2" fill="#d4a574"/><text x="44" y="330" class="m" style="fill:#efebe9;font-size:12.5px">11:30</text><text x="92" y="330" class="h" style="font-size:13px" >Compiler project</text><text x="232" y="330" style="font-size:13px" >fills a 30-minute gap exactly, and right next to your other block for this task</text></g>
</g>
</svg>
