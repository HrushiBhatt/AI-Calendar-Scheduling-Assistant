<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- GitHub Pages can't send response headers, so the policy the Go server sends lives here. wasm-unsafe-eval runs the scheduler. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'" />
    <title>Brew Focus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A retro pixel-art focus timer that plans your deep work around your real calendar." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
