<!-- The name and mug on one side, the form on the other, so the page uses its whole width. -->
<main class="welcome">
  <section class="brand">
    <app-pixel-mug class="mug" [fill]="1" [running]="true" />
    <h1 class="title">Brew Focus</h1>
    <p class="tagline">Pomodoro timers, tasks and streaks. Focus sessions that follow you across devices and add up to habits.</p>
  </section>

  <section class="card panel px">
    <div class="switch-row" role="tablist" aria-label="Account">
      <button class="seg px" type="button" role="tab" [attr.aria-selected]="mode() === 'login'" (click)="switchTo('login')">Log in</button>
      <button class="seg px" type="button" role="tab" [attr.aria-selected]="mode() === 'register'" (click)="switchTo('register')">Sign up</button>
    </div>

    <form class="modal-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (mode() === 'register') {
        <label class="field">
          <span>Name <span class="optional">(optional)</span></span>
          <input class="input px" formControlName="name" autocomplete="name" maxlength="60" />
        </label>
      }
      <label class="field">
        Email
        <input class="input px" type="email" formControlName="email" autocomplete="email" />
      </label>
      <label class="field">
        Password
        <input
          class="input px"
          type="password"
          formControlName="password"
          [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
          [attr.placeholder]="mode() === 'register' ? minPassword + '+ characters' : null"
        />
      </label>
      @if (error()) {
        <p class="form-error" role="alert">{{ error() }}</p>
      }
      <button class="btn btn-primary px" [disabled]="busy()">
        {{ busy() ? 'Brewing…' : mode() === 'login' ? 'Log in' : 'Create account' }}
      </button>
    </form>
  </section>
</main>
