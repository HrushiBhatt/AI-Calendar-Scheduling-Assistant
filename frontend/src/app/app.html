<div class="app">
  <header class="header">
    <a class="logo" routerLink="/">
      <span class="logo-icon" aria-hidden="true">☕</span>
      <span class="logo-text">Brew Focus</span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a class="tab px" routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Brew</a>
      <a class="tab px" routerLink="/progress" routerLinkActive="active" ariaCurrentWhenActive="page">Progress</a>
    </nav>
    <div class="tools">
      <button class="icon-btn head-btn px" (click)="theme.toggle()" [attr.aria-label]="theme.current() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        <app-sprite class="icon" [rows]="theme.current() === 'dark' ? sun : moon" />
      </button>
      <button class="icon-btn head-btn settings-btn px" (click)="brew.dialog.set('settings')" aria-label="Settings">
        <app-sprite class="icon" [rows]="gear" />
      </button>
    </div>
  </header>

  <router-outlet />

  @switch (brew.dialog()) {
    @case ('intention') {
      <app-intention-dialog />
    }
    @case ('breathe') {
      <app-breathing-dialog />
    }
    @case ('reflect') {
      <app-reflection-dialog />
    }
    @case ('settings') {
      <app-settings-dialog />
    }
  }

  <div #toast class="toast px" popover="manual" [class.show]="toasts.current().visible" role="status" aria-live="polite">
    {{ toasts.current().message }}
  </div>
</div>
