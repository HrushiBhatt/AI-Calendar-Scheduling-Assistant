<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <!-- GitHub Pages can't send response headers, so the security policy lives here. The Go server also
         sends it as a header. It allows only this site's own scripts, styles, fonts and images, so injected
         markup can't run a script or send data anywhere. Inline styles stay allowed because Angular writes
         component styles into the page. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'"/>
